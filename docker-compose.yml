services:
  app:
    build: .
    container_name: raffal-backend
    ports:
      - "7005:7005"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=7005
      - MONGO_URI=mongodb://mongo:27017/raffal
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mongo
      - redis
    restart: unless-stopped
  mongo:
    image: mongo:latest
    container_name: raffal-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: raffal-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
